name: GymCoach
options:
  bundleIdPrefix: com.gymcoach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  GymCoach:
    type: application
    platform: iOS
    sources:
      - path: GymCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymcoach.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: GymCoach/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: GymCoach/Info.plist
